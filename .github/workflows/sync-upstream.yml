name: Sync fork with upstream
on:
  schedule:
    - cron: "30 1 * * 1" # Mondays at 01:30 UTC (07:00 IST)
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    # Only run in forks, never in the upstream repository itself.
    if: github.repository != 'stats-organization/github-stats-extended'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: [master, release]
    steps:
      - name: Merge upstream ${{ matrix.branch }}
        env:
          # GITHUB_TOKEN cannot update files under .github/workflows. If upstream
          # changes a workflow, the sync fails unless SYNC_TOKEN is set to a PAT
          # with the "workflow" scope (classic) or Contents + Workflows write (fine-grained).
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch="${BRANCH}"
